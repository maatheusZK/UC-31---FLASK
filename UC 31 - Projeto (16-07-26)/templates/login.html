<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login">

<h1>Login</h1>

<form method="POST">

<label>Usuário</label>
<input type="text" name="usuario" required>

<label>Senha</label>
<input type="password" name="senha" required>

<button type="submit">Entrar</button>

</form>

{% if mensagem %}
<p class="erro">{{ mensagem }}</p>
{% endif %}

</body>
</html>
