<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #f8f9fa;
        }

        .carousel img{
            height: 500px;
            object-fit: cover;
        }

        .titulo{
            font-size: 3rem;
            font-weight: bold;
            color: #dc3545;
        }

        .slogan{
            font-size: 1.3rem;
            color: #555;
        }
    </style>

</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🍔 FoodExpress
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/cardapio">Cardápio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contato">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="banner" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#banner" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#banner" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#banner" data-bs-slide-to="2"></button>
        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='img/banner1.jpg') }}" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/banner2.jpg') }}" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="{{ url_for('static', filename='img/banner3.jpg') }}" class="d-block w-100">
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#banner" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#banner" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <div class="container text-center mt-5">

        <h1 class="titulo">Burger House</h1>

        <p class="slogan">
            O sabor que conquista na primeira mordida!
        </p>

        <div class="mt-4">
            <a href="/cardapio" class="btn btn-danger btn-lg me-2">
                Ver Cardápio
            </a>

            <a href="/pedido" class="btn btn-outline-dark btn-lg">
                Fazer Pedido
            </a>
        </div>

        <div class="alert alert-success mt-5" role="alert">
            🎉 Frete grátis acima de R$ 50!
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
