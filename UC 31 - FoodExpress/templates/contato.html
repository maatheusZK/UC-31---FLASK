<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - FoodExpress</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #f8f9fa;
        }

        .card-formulario{
            max-width: 700px;
            margin: auto;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🍔 FoodExpress
            </a>

            <a href="/" class="btn btn-light">
                Voltar
            </a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow p-4 card-formulario">

            <h1 class="text-center mb-4">
                Entre em Contato
            </h1>

            <form>

                <div class="mb-3">
                    <label class="form-label">
                        Nome
                    </label>

                    <input 
                        type="text" 
                        class="form-control"
                        placeholder="Digite seu nome"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        E-mail
                    </label>

                    <input 
                        type="email" 
                        class="form-control"
                        placeholder="Digite seu e-mail"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Mensagem
                    </label>

                    <textarea 
                        class="form-control"
                        rows="5"
                        placeholder="Digite sua mensagem">
                    </textarea>
                </div>

                <button class="btn btn-danger w-100">
                    Enviar
                </button>

            </form>

            <div class="mt-5 text-center">

                <h4>
                    Informações
                </h4>

                <p>
                    📍 Rua Pastelquistão, 123
                </p>

                <p>
                    📞 (84) 4002-8922
                </p>

                <p>
                    ✉ contato@foodexpress.com
                </p>

            </div>

        </div>

    </div>

</body>
</html>
